resources:
  jobs:
    armguard_daily:
      name: armguard-daily
      parameters:
        - { name: catalog, default: "${var.catalog}" }
        - { name: team_id, default: "${var.team_id}" }
        - { name: as_of_date, default: "${var.as_of_date}" }
        - { name: llm_endpoint, default: "${var.llm_endpoint}" }
        - { name: judge_endpoint, default: "${var.judge_endpoint}" }
        - { name: presenter, default: "${var.presenter}" }
        - { name: judge, default: "0" }
        - { name: validate, default: "0" }
        - { name: force, default: "0" }
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies: ["requests", "pandas", "numpy", "scikit-learn==1.6.1", "mlflow[databricks]>=3.1",
                           "databricks-sdk>=0.158", "psycopg[binary]>=3.2", "sqlalchemy>=2.0", "faker==30.8.2", "tabulate"]
      tasks:
        - task_key: t0_setup
          environment_key: default
          spark_python_task:
            python_file: ../src/2_governance/govern.py
            parameters: ["--mode=setup", "--catalog={{job.parameters.catalog}}", "--presenter={{job.parameters.presenter}}"]
        - task_key: t1_ingest_mlb
          depends_on: [{ task_key: t0_setup }]
          environment_key: default
          spark_python_task:
            python_file: ../src/1_lakeflow/ingest_mlb.py
            parameters: ["--catalog={{job.parameters.catalog}}", "--team_id={{job.parameters.team_id}}"]
        - task_key: t2_simulate_club
          depends_on: [{ task_key: t1_ingest_mlb }]
          environment_key: default
          spark_python_task:
            python_file: ../src/1_lakeflow/simulate_club.py
            parameters: ["--catalog={{job.parameters.catalog}}", "--team_id={{job.parameters.team_id}}"]
        - task_key: t3_pipeline
          depends_on: [{ task_key: t2_simulate_club }]
          pipeline_task: { pipeline_id: "${resources.pipelines.armguard_sdp.id}", full_refresh: true }
        - task_key: t4_govern
          depends_on: [{ task_key: t3_pipeline }]
          environment_key: default
          spark_python_task:
            python_file: ../src/2_governance/govern.py
            parameters: ["--mode=govern", "--catalog={{job.parameters.catalog}}", "--presenter={{job.parameters.presenter}}"]
        - task_key: t5_train
          depends_on: [{ task_key: t4_govern }]
          environment_key: default
          spark_python_task:
            python_file: ../src/3_ml/train.py
            parameters: ["--catalog={{job.parameters.catalog}}"]
        - task_key: t6_score
          depends_on: [{ task_key: t5_train }]
          environment_key: default
          spark_python_task:
            python_file: ../src/3_ml/score.py
            parameters: ["--catalog={{job.parameters.catalog}}", "--as_of_date={{job.parameters.as_of_date}}"]
        - task_key: t7_genai
          depends_on: [{ task_key: t6_score }]
          timeout_seconds: 1800
          environment_key: default
          spark_python_task:
            python_file: ../src/4_genai/enrich.py
            parameters: ["--catalog={{job.parameters.catalog}}", "--as_of_date={{job.parameters.as_of_date}}", "--llm_endpoint={{job.parameters.llm_endpoint}}"]
        - task_key: t8_lakebase
          depends_on: [{ task_key: t7_genai }]
          environment_key: default
          spark_python_task:
            python_file: ../src/5_lakebase/lakebase.py
            parameters: ["--mode=sync", "--catalog={{job.parameters.catalog}}", "--as_of_date={{job.parameters.as_of_date}}"]
        - task_key: t9_genie
          depends_on: [{ task_key: t8_lakebase }]
          environment_key: default
          spark_python_task:
            python_file: ../src/6_genie/genie.py
            parameters: ["--catalog={{job.parameters.catalog}}", "--warehouse_id=${resources.sql_warehouses.armguard_wh.id}"]
        - task_key: t10_gate
          depends_on: [{ task_key: t9_genie }]
          condition_task: { op: EQUAL_TO, left: "{{job.parameters.validate}}", right: "1" }
        - task_key: t10_validate
          depends_on: [{ task_key: t10_gate, outcome: "true" }]
          environment_key: default
          spark_python_task:
            python_file: ../src/3_ml/validate.py
            parameters: ["--catalog={{job.parameters.catalog}}", "--force={{job.parameters.force}}"]
        - task_key: t10_genai_eval
          depends_on: [{ task_key: t9_genie }]
          timeout_seconds: 1800
          environment_key: default
          spark_python_task:
            python_file: ../src/4_genai/genai_eval.py
            parameters: ["--catalog={{job.parameters.catalog}}", "--judge_endpoint={{job.parameters.judge_endpoint}}", "--judge={{job.parameters.judge}}"]
    armguard_ops_tools:
      name: armguard-ops-tools
      parameters:
        - { name: catalog, default: "${var.catalog}" }
        - { name: as_of_date, default: "${var.as_of_date}" }
        - { name: mode, default: snapshot }
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies: ["pandas", "databricks-sdk>=0.158", "psycopg[binary]>=3.2", "sqlalchemy>=2.0", "tabulate"]
      tasks:
        - task_key: ops
          environment_key: default
          spark_python_task:
            python_file: ../src/5_lakebase/lakebase.py
            parameters: ["--mode={{job.parameters.mode}}", "--catalog={{job.parameters.catalog}}", "--as_of_date={{job.parameters.as_of_date}}"]
